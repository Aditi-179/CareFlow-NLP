services:
  # All-in-One Unified Web Service (React Frontend + FastAPI Backend)
  - type: web
    name: careflow-nlp
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: CORS_ORIGINS
        value: "*"
